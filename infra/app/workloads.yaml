# 管理前後端 Deployment、Service 和 HTTPRoute
apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: angular-workloads
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/0xc0dec0ffeelab/angular.git
    targetRevision: main
    path: infra/k8s/workloads

  destination:
    server: https://kubernetes.default.svc
    namespace: angular-local

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true