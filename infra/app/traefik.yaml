# 由 Argo CD 安裝 Traefik Helm Chart，作為未來 Angular / NestJS 的網路入口
apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: traefik
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://traefik.github.io/charts
    chart: traefik
    targetRevision: 39.0.7

    helm:
      releaseName: traefik

      valuesObject:
        deployment:
          replicas: 1

        service:
          type: ClusterIP

        providers:
          kubernetesIngress:
            enabled: true

          kubernetesGateway:
            enabled: true

        ingressClass:
          enabled: true
          isDefaultClass: false

        gateway:
          enabled: true
          name: angular-gateway

          listeners:
            web:
              port: 8000
              protocol: HTTP
              namespacePolicy:
                from: All

        gatewayClass:
          enabled: true
          name: traefik

        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 250m
            memory: 256Mi

  destination:
    server: https://kubernetes.default.svc
    namespace: traefik

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true