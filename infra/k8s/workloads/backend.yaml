apiVersion: apps/v1
kind: Deployment

metadata:
  name: angular-backend

spec:
  replicas: 1

  selector:
    matchLabels:
      app: angular-backend

  template:
    metadata:
      labels:
        app: angular-backend

    spec:
      containers:
        - name: backend
          image: ghcr.io/0xc0dec0ffeelab/angular-backend:latest

          imagePullPolicy: Always

          ports:
            - name: http
              containerPort: 3000

          envFrom:
            - configMapRef:
                name: angular-config

            - secretRef:
                name: angular-backend-secret

          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi

---
apiVersion: v1
kind: Service

metadata:
  name: angular-backend

spec:
  type: ClusterIP

  selector:
    app: angular-backend

  ports:
    - name: http
      port: 3000
      targetPort: http