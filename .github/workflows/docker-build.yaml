name: Build Docker Images

on:
  push:
    branches:
      - main
    paths:
      - "agapp/**"
      - "backend/**"
      - ".github/workflows/docker-build.yaml"

  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - name: frontend
            context: ./agapp
            image: angular-frontend

          - name: backend
            context: ./backend
            image: angular-backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ghcr.io/0xc0dec0ffeelab/${{ matrix.image }}:latest
            ghcr.io/0xc0dec0ffeelab/${{ matrix.image }}:${{ github.sha }}