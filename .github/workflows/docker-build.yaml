
name: Build Docker Images and Deploy

on:
  push:
    branches:
      - main
    paths:
      - "agapp/**"
      - "backend/**"
      - ".github/workflows/docker-build.yaml"

  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: angular-deployment
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - name: frontend
            context: ./agapp
            image: angular-frontend

          - name: backend
            context: ./backend
            image: angular-backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ghcr.io/0xc0dec0ffeelab/${{ matrix.image }}:latest
            ghcr.io/0xc0dec0ffeelab/${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  update-gitops:
    name: Update GitOps manifests
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Update image tags
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("infra/k8s/workloads/kustomization.yaml")
          content = path.read_text(encoding="utf-8")
          tag = os.environ["IMAGE_TAG"]

          for image in ("angular-frontend", "angular-backend"):
              name = f"ghcr.io/0xc0dec0ffeelab/{image}"
              pattern = (
                  r"(^\s*-\s*name:\s*" + re.escape(name)
                  + r"\s*\n\s*newTag:\s*)\S+"
              )

              content, count = re.subn(
                  pattern,
                  lambda m: m.group(1) + tag,
                  content,
                  flags=re.MULTILINE,
              )

              if count != 1:
                  raise RuntimeError(
                      f"Expected one image entry for {name}, found {count}"
                  )

          path.write_text(content, encoding="utf-8")
          PY

      - name: Commit and push GitOps changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add infra/k8s/workloads/kustomization.yaml

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "chore(gitops): deploy ${{ github.sha }}"

          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi

            echo "Push failed, retrying ($attempt/3)"
            git fetch origin main
            git rebase origin/main
            sleep 3
          done

          echo "Failed to push GitOps changes"
          exit 1
