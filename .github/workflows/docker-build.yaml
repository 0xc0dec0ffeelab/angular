
name: Build Docker Images and Deploy

on:
  push:
    branches:
      - main
    paths:
      - "agapp/**"
      - "backend/**"
      - ".github/workflows/docker-build.yaml"

  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: angular-deployment
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: frontend
            context: ./agapp
            image: angular-frontend

          - name: backend
            context: ./backend
            image: angular-backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/0xc0dec0ffeelab/${{ matrix.image }}:latest
            ghcr.io/0xc0dec0ffeelab/${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      - name: Verify Image Manifest
        run: |
          docker buildx imagetools inspect \
            ghcr.io/0xc0dec0ffeelab/${{ matrix.image }}:${{ github.sha }}

      - name: Verify Image Pull
        run: |
          docker pull \
            ghcr.io/0xc0dec0ffeelab/${{ matrix.image }}:${{ github.sha }}

  update-gitops:
    name: Update GitOps manifests
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Update image tags
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import yaml

          path = Path("infra/k8s/workloads/kustomization.yaml")
          data = yaml.safe_load(path.read_text(encoding="utf-8"))

          tag = os.environ["IMAGE_TAG"]
          expected = {
              "ghcr.io/0xc0dec0ffeelab/angular-frontend",
              "ghcr.io/0xc0dec0ffeelab/angular-backend",
          }

          updated = set()

          for image in data.get("images", []):
              name = image.get("name")

              if name in expected:
                  image["newTag"] = tag
                  updated.add(name)

          if updated != expected:
              missing = expected - updated
              raise RuntimeError(
                  f"Missing image entries: {sorted(missing)}"
              )

          path.write_text(
              yaml.safe_dump(data, sort_keys=False),
              encoding="utf-8",
          )
          PY

      - name: Commit and Push GitOps Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add infra/k8s/workloads/kustomization.yaml

          if git diff --cached --quiet; then
            echo "No GitOps changes detected"
            exit 0
          fi

          git commit -m "chore(gitops): deploy ${{ github.sha }}"

          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "GitOps manifests updated"
              exit 0
            fi

            echo "Push failed, retrying ($attempt/3)"
            git fetch origin main
            git rebase origin/main || exit 1
            sleep 3
          done

          echo "Failed to push GitOps changes"
          exit 1
